# 中文版发布：手动运行（或推 v1.2.3 这样的版本标签）时，按源码里的版本号编译、替换进原版发布包、发布到本仓库 Release。
name: 发布中文版
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 装 NSIS（做安装程序）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: 编译、打包、发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARTARUS_SENTRY_DSN: ${{ secrets.TARTARUS_SENTRY_DSN }}
          # 写 womeizui119/kunshou-release 的令牌（Settings → Secrets → Actions 里加 RELEASE_TOKEN）；没有就只发本仓库
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 tools/zh/build_zh.py --publish
