# 中文版发布：手动运行（或推 v1.2.3 这样的版本标签）时，按源码里的版本号编译、替换进原版发布包、发布到本仓库 Release。
name: 发布中文版
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: 编译、打包、发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARTARUS_SENTRY_DSN: ${{ secrets.TARTARUS_SENTRY_DSN }}
        run: python3 tools/zh/build_zh.py --publish
